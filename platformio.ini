; ESP32 side of the weather station (MYOSA motherboard)
; Build / Upload / Monitor with the PlatformIO buttons on the bottom bar.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit BMP085 Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
